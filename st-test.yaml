apiVersion: v1
kind: Pod
metadata:
  name: storage-test
  
spec:
  containers:
  - name: storage-test
    image: busybox:1.36
    command: ["sleep", "3600"]
    volumeMounts: 
      - name: data-volume
        mountPath: /data
    
  volumes:
    - name: data-volume
      persistentVolumeClaim:
        claimName: app-storage
