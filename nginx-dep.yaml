kind: Deployment
apiVersion: apps/v1
metadata:
  name: nginx-web


spec: 
  replicas: 2
  selector:
    matchLabels: 
      app: nginx-web
  
  template:
    metadata:
      labels: 
        app: nginx-web
##we put container spec here##
    spec:
      containers:
      - name: nginx
        image: nginx:alpine
        envFrom:
        - configMapRef:
            name: nginx-config
        env:
          - name: DB_USERNAME
            valueFrom:
              secretKeyRef:
                name: db-credentials
                key: username
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 10

