kind: Deployment
apiVersion: apps/v1
metadata:
  name: nginx-web


spec: 
  replicas: 2
  selector:
    matchLabels: 
      app: nginx-web
  
  template:
    metadata:
      labels: 
        app: nginx-web
##we put container spec here##
    spec:
      containers:
      - name: nginx
        image: nginx:alpine
        envFrom:
        - configMapRef:
            name: nginx-config